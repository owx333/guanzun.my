<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HomeUp 系统体验 · 从广告线索到交房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF8; --surface:#FFFFFF; --surface-2:#F2F1EE; --line:#E5E3DF;
    --text:#17181A; --muted:#75746F; --amber:#F4600D; --teal:#4F8F5B; --red:#D64541;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:11px;height:11px;background:var(--amber);transform:rotate(45deg);flex-shrink:0;}
  .brand span{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;}
  header .htitle{color:var(--muted);font-size:12px;}

  main{max-width:760px;margin:0 auto;padding:24px 20px 80px;}

  /* ---- stepper ---- */
  .stepper{display:flex;overflow-x:auto;gap:4px;padding-bottom:14px;margin-bottom:6px;}
  .sdot-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:78px;cursor:pointer;}
  .sdot{
    width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);
    display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);
  }
  .sdot-wrap.done .sdot{background:var(--teal);border-color:var(--teal);color:#0B1712;}
  .sdot-wrap.current .sdot{background:var(--amber);border-color:var(--amber);color:#1A1206;box-shadow:0 0 0 4px rgba(244,96,13,.2);}
  .sline{flex:1;height:2px;background:var(--line);margin-top:13px;min-width:8px;}
  .sdot-wrap.done + .sline{background:var(--teal);}
  .slabel{font-size:9.5px;color:var(--muted);margin-top:6px;text-align:center;line-height:1.3;}
  .sdot-wrap.current .slabel{color:var(--amber);font-weight:600;}
  .sdot-wrap.done .slabel{color:var(--teal);}

  /* ---- step card ---- */
  .stepcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;margin-top:10px;}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:.06em;}
  .stepcard h2{font-size:21px;margin-top:8px;}
  .stepcard .lede{color:var(--muted);font-size:13px;margin-top:8px;line-height:1.8;}
  .why{
    margin-top:14px;background:var(--surface-2);border-left:3px solid var(--amber);border-radius:8px;
    padding:10px 14px;font-size:12px;color:var(--text);line-height:1.7;
  }
  .why b{color:var(--amber);}

  /* ---- mock screen ---- */
  .mockscreen{
    margin-top:20px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:18px;
  }
  .mocklabel{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em;}

  /* generic mock ui bits reused across steps */
  .adcard{background:linear-gradient(135deg,#2A3B57,#1B2A3D);border-radius:10px;padding:16px;color:#EAF0FA;}
  .adcard .adtag{font-size:10px;background:rgba(255,255,255,.15);padding:2px 8px;border-radius:10px;display:inline-block;}
  .adcard h4{font-size:14px;margin-top:8px;}
  .adcard p{font-size:11px;opacity:.85;margin-top:4px;}
  .fakebtn{
    display:inline-block;margin-top:10px;background:#4267B2;color:#fff;font-size:11px;
    padding:7px 14px;border-radius:6px;
  }
  .leadlist{margin-top:14px;}
  .leadcard{
    background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;
    font-size:12px;display:flex;justify-content:space-between;align-items:center;opacity:0;transform:translateY(6px);
    transition:all .4s;
  }
  .leadcard.show{opacity:1;transform:translateY(0);}
  .leadcard b{font-size:12.5px;}
  .leadcard .src{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--amber);}
  .empty-hint{color:var(--muted);font-size:11.5px;text-align:center;padding:10px 0;}

  .calbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .calbox input{background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:9px 10px;font-size:13px;font-family:'IBM Plex Mono',monospace;}
  .apptag{
    margin-top:12px;display:none;background:rgba(79,143,91,.15);color:var(--teal);font-size:12px;
    padding:8px 12px;border-radius:8px;font-family:'IBM Plex Mono',monospace;
  }
  .apptag.show{display:block;}

  textarea.mocktext{
    width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:8px;
    padding:10px 12px;font-size:12.5px;line-height:1.6;min-height:70px;font-family:'Inter',sans-serif;
  }
  .thumbrow{display:flex;gap:8px;margin-top:10px;}
  .thumb{
    width:44px;height:44px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:16px;opacity:0;transform:scale(.7);transition:all .35s;
  }
  .thumb.show{opacity:1;transform:scale(1);}

  .quotebox{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;}
  .qrow{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px dashed var(--line);}
  .qrow:last-child{border-bottom:none;font-weight:700;color:var(--text);padding-top:10px;}
  .qrow span:last-child{font-family:'IBM Plex Mono',monospace;}
  .sendtag{margin-top:10px;display:none;color:var(--teal);font-size:12px;font-family:'IBM Plex Mono',monospace;}
  .sendtag.show{display:block;}

  .contractbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .contractbox .doc{width:52px;height:64px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:22px;}
  .signedtag{display:none;color:var(--teal);font-weight:600;font-size:13px;}
  .signedtag.show{display:block;}

  .swatches{display:flex;gap:10px;}
  .swatch{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);cursor:pointer;}
  .swatch.picked{border-color:var(--amber);box-shadow:0 0 0 3px rgba(244,96,13,.2);}

  .subrail{position:relative;height:2px;background:var(--line);margin:16px 6px 0;}
  .subfill{position:absolute;top:0;left:0;height:2px;background:var(--teal);width:0%;transition:width .5s;}
  .subticks{display:flex;justify-content:space-between;margin-top:-5px;}
  .subtick{width:10px;height:10px;border-radius:2px;background:var(--bg);border:2px solid var(--line);}
  .subtick.on{background:var(--teal);border-color:var(--teal);}
  .sublabels{display:flex;justify-content:space-between;margin-top:8px;}
  .sublabels span{font-size:9.5px;color:var(--muted);width:20%;text-align:center;}

  .checklist{display:flex;flex-direction:column;gap:8px;}
  .cklist-item{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:12.5px;cursor:pointer;}
  .cklist-item .box{width:16px;height:16px;border-radius:4px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;}
  .cklist-item.checked .box{background:var(--teal);border-color:var(--teal);color:#0B1712;}
  .cklist-item.checked{color:var(--muted);text-decoration:line-through;}

  .keybox{display:flex;align-items:center;gap:16px;}
  .keybox .icon{font-size:34px;}
  .celebrate{
    display:none;margin-top:14px;background:rgba(79,143,91,.12);border:1px solid var(--teal);border-radius:10px;
    padding:16px;text-align:center;
  }
  .celebrate.show{display:block;}
  .celebrate .big{font-size:28px;}
  .celebrate p{color:var(--teal);font-weight:600;margin-top:6px;font-size:13px;}

  /* ---- action + nav ---- */
  .actionrow{margin-top:20px;}
  .try-btn{
    background:var(--amber);color:#1A1206;border:none;padding:12px 20px;border-radius:9px;
    font-size:13.5px;font-weight:600;font-family:'Space Grotesk',sans-serif;cursor:pointer;
  }
  .try-btn:disabled{opacity:.4;cursor:default;}
  .done-note{margin-top:10px;color:var(--teal);font-size:12px;font-family:'IBM Plex Mono',monospace;display:none;}
  .done-note.show{display:block;}

  .navrow{display:flex;justify-content:space-between;margin-top:22px;}
  .navbtn{
    background:none;border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:8px;
    font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .navbtn.primary{background:var(--amber);color:#1A1206;border:none;font-weight:600;}
  .navbtn:disabled{opacity:.3;cursor:default;}

  .finalnote{
    margin-top:26px;background:var(--surface);border:1px solid var(--teal);border-radius:12px;padding:18px 20px;
    font-size:13px;line-height:1.8;display:none;
  }
  .finalnote.show{display:block;}
</style>
</head>

  <div class="htitle">系统体验模式 · 从广告线索到交房</div>
</header>

<main>
  <div class="stepper" id="stepper"></div>
  <div id="stepcard-holder"></div>
</main>

<script>
const STEPS = [
  {
    id:0, label:'广告线索', tag:'第 1 步 / 9',
    title:'客户从 Facebook 广告留下联络方式',
    lede:'客户刷到 GuanZun 的装修广告,点击"了解更多",填了一个简单的表单。这个表单一提交,就会自动变成系统里的一条新询盘,不用员工自己去广告后台一个个抓。',
    why:'<b>为什么重要:</b> 以前广告的留资常常散落在 FB 表单、Messenger 对话里,容易漏看。进了系统之后,所有线索都在同一个地方,不会飞掉。',
    mockLabel:'模拟:Facebook 广告',
    mockHtml:`
      <div class="adcard">
        <span class="adtag">Sponsored · GuanZun.my</span>
        <h4>全屋翻新,免费上门估价</h4>
        <p>一站式装修服务,从设计到交房全程跟进</p>
        <div class="fakebtn">了解更多</div>
      </div>
      <div class="leadlist">
        <div class="empty-hint" id="leadEmpty">(还没有新询盘)</div>
        <div class="leadcard" id="leadCard">
          <div><b>陈伟明</b> · 012-345 6789<br><span style="color:var(--muted)">需求: 全屋翻新 · 3房2厅</span></div>
          <span class="src">FB 广告</span>
        </div>
      </div>`,
    actionLabel:'模拟客户提交表单',
    onAction:()=>{
      document.getElementById('leadEmpty').style.display='none';
      document.getElementById('leadCard').classList.add('show');
    },
    doneNote:'✓ 新询盘已经自动进入系统'
  },
  {
    id:1, label:'预约', tag:'第 2 步 / 9',
    title:'员工联系客户,安排上门看现场的时间',
    lede:'员工看到新询盘后,打电话给陈伟明,约好一个时间上门勘察。这个预约时间也会记在系统里,提醒员工按时到场。',
    why:'<b>为什么重要:</b> 约好的时间写进系统,不会因为员工忙碌或换人跟进而忘记,客户也不会被"晒飞机"。',
    mockLabel:'模拟:安排预约',
    mockHtml:`
      <div style="font-size:12.5px;margin-bottom:10px;"><b>陈伟明</b> · 012-345 6789 · 全屋翻新</div>
      <div class="calbox">
        <input type="date" id="apptDate" value="2026-08-05">
        <input type="time" id="apptTime" value="10:00">
      </div>
      <div class="apptag" id="apptTag">📅 已安排:2026-08-05 10:00 上门看现场</div>`,
    actionLabel:'确认预约时间',
    onAction:()=>{ document.getElementById('apptTag').classList.add('show'); },
    doneNote:'✓ 预约时间已记录,系统会提醒负责员工'
  },
  {
    id:2, label:'面谈', tag:'第 3 步 / 9',
    title:'员工上门,了解客户的具体需求',
    lede:'员工到场跟陈伟明面谈,了解装修需求、预算、喜好,并拍照记录现场状况。这些笔记和照片会存进这个客户的记录里。',
    why:'<b>为什么重要:</b> 面谈内容不再只留在员工的脑子里 —— 就算换人接手报价,新的人也能看到当初谈了什么。',
    mockLabel:'模拟:面谈记录',
    mockHtml:`
      <div class="mocklabel" style="margin-top:0;">需求笔记</div>
      <textarea class="mocktext" id="notesBox" placeholder="点击下方按钮试试看...">客户需求: 3房2厅全屋翻新,预算约 RM80,000。希望简约风格,厨房要开放式设计。</textarea>
      <div class="mocklabel" style="margin-top:14px;">现场照片</div>
      <div class="thumbrow">
        <div class="thumb" id="th1">🖼️</div>
        <div class="thumb" id="th2">🖼️</div>
        <div class="thumb" id="th3">🖼️</div>
      </div>`,
    actionLabel:'保存面谈记录',
    onAction:()=>{
      ['th1','th2','th3'].forEach((id,i)=> setTimeout(()=>{ const el=document.getElementById(id); if(el) el.classList.add('show'); }, i*150));
    },
    doneNote:'✓ 需求笔记与现场照片已保存'
  },
  {
    id:3, label:'报价', tag:'第 4 步 / 9',
    title:'根据面谈内容,给客户发一份正式报价单',
    lede:'员工把讨论好的项目整理成报价单,里面列清楚每一项工程的费用,发给客户过目。',
    why:'<b>为什么重要:</b> 报价单直接存在系统里,不怕文件夹翻不到、也不怕跟客户各说各话。',
    mockLabel:'模拟:报价单',
    mockHtml:`
      <div class="quotebox">
        <div class="qrow"><span>拆除工程</span><span>RM 3,200</span></div>
        <div class="qrow"><span>水电工程</span><span>RM 12,500</span></div>
        <div class="qrow"><span>木工 / 天花</span><span>RM 28,000</span></div>
        <div class="qrow"><span>油漆工程</span><span>RM 6,800</span></div>
        <div class="qrow"><span>总额</span><span>RM 80,500</span></div>
      </div>
      <div class="sendtag" id="sendTag">📨 已发送给陈伟明 · 状态:待客户确认</div>`,
    actionLabel:'发送报价单给客户',
    onAction:()=>{ document.getElementById('sendTag').classList.add('show'); },
    doneNote:'✓ 报价单已发送,客户可以在手机上查看'
  },
  {
    id:4, label:'成交', tag:'第 5 步 / 9',
    title:'客户同意报价,签合同、交订金',
    lede:'陈伟明接受报价,双方签署合同,客户支付订金,这单工程正式成交。',
    why:'<b>为什么重要:</b> 一旦标记"已签约",系统会自动把这个客户排进施工排程,后面的步骤就正式开始跟进。',
    mockLabel:'模拟:签约',
    mockHtml:`
      <div class="contractbox">
        <div class="doc">📄</div>
        <div>
          <div style="font-size:13px;font-weight:600;">装修工程合同</div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:3px;">订金: RM 24,150 (30%)</div>
          <div class="signedtag" id="signedTag" style="margin-top:8px;">✓ 已签约,订金已收</div>
        </div>
      </div>`,
    actionLabel:'标记客户已签约',
    onAction:()=>{ document.getElementById('signedTag').classList.add('show'); },
    doneNote:'✓ 工程正式成交,已排入施工排程'
  },
  {
    id:5, label:'讨论', tag:'第 6 步 / 9',
    title:'开工前,确认设计细节与材料',
    lede:'签约后,还要跟客户确认具体的设计方案、材料款式(地板、油漆颜色等),这些细节谈妥才正式开工,避免施工中途才发现客户不满意。',
    why:'<b>为什么重要:</b> 材料和设计一旦写进系统并让客户确认,施工时如果有争议,双方都有据可查。',
    mockLabel:'模拟:选材料',
    mockHtml:`
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px;">选择地板颜色(点一下试试)</div>
      <div class="swatches">
        <div class="swatch" style="background:#C9B79C;" data-c="1"></div>
        <div class="swatch" style="background:#8C7A63;" data-c="2"></div>
        <div class="swatch" style="background:#4A4038;" data-c="3"></div>
      </div>
      <div class="apptag" id="matTag">🎨 已选择:胡桃木色地板,设计方案确认</div>`,
    actionLabel:'确认设计定案',
    onAction:()=>{ document.getElementById('matTag').classList.add('show'); },
    doneNote:'✓ 设计与材料已确认,可以安排开工'
  },
  {
    id:6, label:'工程进度', tag:'第 7 步 / 9',
    title:'施工开始,过程一步步更新进度',
    lede:'工人进场施工,从拆除到油漆,每完成一个小阶段,员工就上传照片、更新进度。客户和老板都能看到目前做到哪里。',
    why:'<b>为什么重要:</b> 这是整个装修花时间最长的阶段,也是最容易"失联"的阶段 —— 定期更新能让客户安心,减少催促电话。',
    mockLabel:'模拟:施工进度',
    mockHtml:`
      <div class="subrail"><div class="subfill" id="subFill"></div></div>
      <div class="subticks" id="subTicks">
        <div class="subtick"></div><div class="subtick"></div><div class="subtick"></div><div class="subtick"></div><div class="subtick"></div>
      </div>
      <div class="sublabels"><span>拆除</span><span>水电</span><span>木工</span><span>油漆</span><span>清洁</span></div>
      <div class="thumbrow" style="margin-top:16px;">
        <div class="thumb" id="pth1">🧱</div>
        <div class="thumb" id="pth2">🔌</div>
      </div>`,
    actionLabel:'更新一个施工阶段',
    onAction:(()=>{
      let n=0;
      return ()=>{
        n = Math.min(n+1, 5);
        document.getElementById('subFill').style.width = (n/5*100)+'%';
        const ticks = document.querySelectorAll('#subTicks .subtick');
        ticks.forEach((t,i)=> t.classList.toggle('on', i<n));
        if(n>=1) document.getElementById('pth1').classList.add('show');
        if(n>=2) document.getElementById('pth2').classList.add('show');
      };
    })(),
    doneNote:'✓ 进度已更新,客户手机上会同步看到'
  },
  {
    id:7, label:'完成阶段', tag:'第 8 步 / 9',
    title:'施工完成,检查有没有需要修补的地方',
    lede:'工程做完后,员工要逐项检查质量 —— 水电有没有问题、油漆有没有瑕疵、五金有没有装好,确认没问题才能交给客户。',
    why:'<b>为什么重要:</b> 这一步是保护公司的口碑 —— 交房前先自己检查一遍,减少交房后才被投诉的情况。',
    mockLabel:'模拟:验收检查表(点一下打勾)',
    mockHtml:`
      <div class="checklist" id="checklist">
        <div class="cklist-item" data-k="1"><div class="box"></div>水电测试正常</div>
        <div class="cklist-item" data-k="2"><div class="box"></div>油漆无瑕疵</div>
        <div class="cklist-item" data-k="3"><div class="box"></div>五金安装稳固</div>
        <div class="cklist-item" data-k="4"><div class="box"></div>现场清洁完毕</div>
      </div>`,
    actionLabel:'全部检查完成',
    onAction:()=>{
      document.querySelectorAll('#checklist .cklist-item').forEach((el,i)=>{
        setTimeout(()=>{ if(!el.isConnected) return; el.classList.add('checked'); el.querySelector('.box').textContent='✓'; }, i*150);
      });
    },
    doneNote:'✓ 验收通过,可以安排交房'
  },
  {
    id:8, label:'交房', tag:'第 9 步 / 9',
    title:'钥匙交给客户,项目正式完成',
    lede:'检查都没问题后,把钥匙和保修文件交给陈伟明,整个装修工程正式结束。这个客户在系统里的记录也会标记为"已完成"。',
    why:'<b>为什么重要:</b> 从第一步的广告线索,到这里正式交房,整整 9 个步骤全部有记录 —— 这就是这套系统真正做的事。',
    mockLabel:'模拟:交房',
    mockHtml:`
      <div class="keybox">
        <div class="icon">🔑</div>
        <div style="font-size:12.5px;color:var(--muted);">钥匙 + 保修卡,准备交给客户</div>
      </div>
      <div class="celebrate" id="celebrate">
        <div class="big">🎉</div>
        <p>项目完成!感谢陈伟明的信任</p>
      </div>`,
    actionLabel:'确认交房',
    onAction:()=>{ document.getElementById('celebrate').classList.add('show'); },
    doneNote:'✓ 项目已完成,客户与老板的系统记录都会显示"已交房"'
  },
];

let current = 0;
const acted = new Array(STEPS.length).fill(false);

function renderStepper(){
  const el = document.getElementById('stepper');
  el.innerHTML = STEPS.map((s,i)=>{
    const cls = i===current ? 'current' : (acted[i] ? 'done' : '');
    const dotContent = acted[i] && i!==current ? '✓' : (i+1);
    return `<div class="sdot-wrap ${cls}" onclick="goTo(${i})">
        <div class="sdot">${dotContent}</div>
        <div class="slabel">${s.label}</div>
      </div>${i<STEPS.length-1 ? '<div class="sline"></div>' : ''}`;
  }).join('');
}

function renderStep(){
  const s = STEPS[current];
  const holder = document.getElementById('stepcard-holder');
  holder.innerHTML = `
    <div class="stepcard">
      <div class="tag">${s.tag}</div>
      <h2>${s.title}</h2>
      <p class="lede">${s.lede}</p>
      <div class="why">${s.why}</div>
      <div class="mockscreen">
        <div class="mocklabel">${s.mockLabel}</div>
        ${s.mockHtml}
      </div>
      <div class="actionrow">
        <button class="try-btn" id="tryBtn">👉 试试看:${s.actionLabel}</button>
        <div class="done-note" id="doneNote">${s.doneNote}</div>
      </div>
      ${current===STEPS.length-1 ? `<div class="finalnote" id="finalNote">
        这就是完整的一套流程 —— 从广告线索到交房,一共 9 个步骤,每一步都有记录。<br><br>
        客户全程用手机就能查自己到哪一步了;老板打开系统,能看到所有客户目前都卡在哪一步。
      </div>` : ''}
      <div class="navrow">
        <button class="navbtn" id="prevBtn" ${current===0?'disabled':''} onclick="goTo(current-1)">← 上一步</button>
        <button class="navbtn primary" id="nextBtn" ${current===STEPS.length-1?'disabled':''} onclick="goTo(current+1)">下一步 →</button>
      </div>
    </div>`;

  document.getElementById('tryBtn').onclick = ()=>{
    s.onAction();
    acted[current] = true;
    document.getElementById('doneNote').classList.add('show');
    document.getElementById('tryBtn').disabled = true;
    if(current===STEPS.length-1){
      const fn = document.getElementById('finalNote');
      if(fn) fn.classList.add('show');
    }
    renderStepper();
  };
  if(acted[current]){
    document.getElementById('doneNote').classList.add('show');
    // re-apply visual state for revisited steps
    s.onAction();
    if(current===STEPS.length-1){
      const fn = document.getElementById('finalNote');
      if(fn) fn.classList.add('show');
    }
  }
}

function goTo(i){
  current = Math.max(0, Math.min(STEPS.length-1, i));
  renderStepper();
  renderStep();
  window.scrollTo({top:0, behavior:'smooth'});
}

renderStepper();
renderStep();
</script>
</body>
</html>
